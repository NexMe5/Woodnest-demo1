  const c = CAT[p.cat];
  document.title = `${p.short} — Woodnest`;
  $('#crumb').innerHTML = `<a href="#/index">Home</a><span>/</span><a href="#/${p.cat}">${c.title}</a><span>/</span><a href="#/${p.cat}?sub=${encodeURIComponent(p.sub)}">${p.sub}</a><span>/</span><span>${esc(p.short)}</span>`;
  const gal = p.gallery.slice(0, 4);
  const colors = c.cols.slice(0, 4).includes(p.color) ? c.cols.slice(0, 4) : [p.color, ...c.cols.slice(0, 3)];
  const on = getWish().includes(p.id);
  const dims = { sofas: '210 × 88 × 82 cm', bedroom: '208 × 170 × 105 cm', dining: '180 × 90 × 76 cm', living: '120 × 60 × 42 cm', mattresses: '198 × 152 × 20 cm', 'work-from-home': '120 × 60 × 75 cm', storage: '120 × 55 × 190 cm', 'lamps-decor': '40 × 40 × 155 cm', 'soft-furnishing': '160 × 230 cm', outdoor: '70 × 68 × 80 cm' }[p.cat];
  $('#pdp').innerHTML = `
  <div class="gal rv in">
    <div class="thumbs">${gal.map((g, i) => `<button class="${i ? '' : 'on'}" data-g="${g}" aria-label="View image ${i + 1}"><img src="${IMG(g, 160, 160)}" alt=""></button>`).join('')}</div>
    <div class="ph mainimg" id="main"><img src="${IMG(gal[0], 1000, 1000)}" alt="${esc(p.name)}"></div>
  </div>
  <div class="pinfo stagger">
    <div class="by">${c.title} · ${esc(p.sub)}</div>
    <h1>${esc(p.name)}</h1>
    <div><span class="rating">★ ${p.rating} <span style="font-weight:500">· ${p.reviews} reviews</span></span></div>
    <div><div class="bigprice"><b>${inr(p.price)}</b><s>${inr(p.mrp)}</s><em>${p.off}% OFF</em></div><div class="tax">Inclusive of all taxes · EMI from ${inr(p.price / 12)}/month</div></div>
    <div class="offers-box"><div><b>NEST5K</b> — extra ₹5,000 off on orders above ₹40,000</div><div><b>Card offer</b> — flat ₹4,500 off on select credit card EMI</div></div>
    <div>
      <div class="opt"><h4>Colour: <span id="colName">${p.color}</span></h4><div class="colors">${colors.map(cl => `<button class="${cl === p.color ? 'on' : ''}" style="background:${COLORS[cl]}" data-col="${cl}" aria-label="${cl}"></button>`).join('')}</div></div>
      <div class="opt"><h4>Quantity</h4><div class="qty"><button data-q="-1" aria-label="Decrease">−</button><span id="qty">1</span><button data-q="1" aria-label="Increase">+</button></div></div>
      <div class="buy"><button class="btn btn-dark" id="addBtn">Add to cart</button><a href="#/cart" class="btn btn-clay" id="buyBtn">Buy now</a>
        <button class="ib heart${on ? ' on' : ''}" data-wish="${p.id}" aria-label="Save to wishlist" aria-pressed="${on}" style="position:static;opacity:1;transform:none;width:50px;height:50px;border:1px solid var(--line);background:#fff">${ICON.heart}</button></div>
      <div class="opt"><h4>Check delivery</h4><form class="pin-check" id="pinF"><input placeholder="Enter 6-digit pincode" inputmode="numeric" maxlength="6" aria-label="Pincode"><button class="btn btn-line" style="padding:10px 18px">Check</button></form><div class="pin-msg" id="pinMsg" aria-live="polite"></div></div>
      <div class="perks"><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.6"/><circle cx="17" cy="17.5" r="1.6"/></svg>Free delivery</div><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m14.7 6.3 3 3L9 18H6v-3z"/></svg>Free assembly</div><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/></svg>${p.mat.match(/Sheesham|Teak|Acacia|Mango/) ? '3' : '1'}-year warranty</div></div>
      <div class="acc">
        <details open><summary>Overview</summary><div class="body">The ${esc(p.short)} pairs ${p.mat.toLowerCase()} construction with a ${p.color.toLowerCase()} finish for a piece that looks considered from every angle. Built to be lived with — sturdy joinery, smooth edges and finishes that age gracefully.</div></details>
        <details><summary>Specifications</summary><div class="body"><dl class="specs"><dt>Material</dt><dd>${p.mat}</dd><dt>Finish</dt><dd>${p.color}</dd><dt>Dimensions</dt><dd>${dims} (W × D × H)</dd><dt>Assembly</dt><dd>Done by our team, free</dd><dt>Product code</dt><dd>WN-${p.id.toUpperCase()}</dd></dl></div></details>
        <details><summary>Care</summary><div class="body">Dust with a soft dry cloth. Wipe spills immediately. Keep away from direct sunlight and moisture. Need a polish or repair later? <a href="#/care-repair" style="color:var(--clay-2);font-weight:700">Book Care &amp; Repair</a>.</div></details>
        <details><summary>Delivery &amp; returns</summary><div class="body">Delivered in 7–14 days in most cities. Free returns within 7 days of delivery if the product is unused.</div></details>
      </div>
    </div>
  </div>`;

  let qty = 1;
  $('#pdp').addEventListener('click', e => {
    const t = e.target.closest('[data-g]');
    if (t) { $$('.thumbs button').forEach(b => b.classList.toggle('on', b === t)); const im = $('#main img'); im.style.opacity = 0; setTimeout(() => { im.src = IMG(t.dataset.g, 1000, 1000); im.style.opacity = 1; }, 180); }
    const q = e.target.closest('[data-q]'); if (q) { qty = Math.max(1, Math.min(9, qty + +q.dataset.q)); $('#qty').textContent = qty; }
    const col = e.target.closest('[data-col]'); if (col) { $$('.colors button').forEach(b => b.classList.toggle('on', b === col)); $('#colName').textContent = col.dataset.col; }
  });
  $('#addBtn').onclick = () => addToCart(p.id, qty);
  $('#buyBtn').onclick = () => { const c = getCart(); if (!c.find(x => x.id === p.id)) { c.push({ id: p.id, qty }); store.set('cart', c); } };
  $('#pinF').onsubmit = e => { e.preventDefault(); const v = $('#pinF input').value.trim(); const d = new Date(Date.now() + 9 * 864e5);
    $('#pinMsg').style.color = /^[1-9]\d{5}$/.test(v) ? 'var(--ok)' : '#B3261E';
    $('#pinMsg').textContent = /^[1-9]\d{5}$/.test(v) ? `✓ Delivers to ${v} by ${d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' })} · Free assembly included` : 'Please enter a valid 6-digit pincode'; };
  // hover zoom
  const m = $('#main');
  m.addEventListener('mousemove', e => { const r = m.getBoundingClientRect(); const im = $('img', m); im.style.transformOrigin = `${(e.clientX - r.left) / r.width * 100}% ${(e.clientY - r.top) / r.height * 100}%`; im.style.transform = 'scale(1.8)'; });
  m.addEventListener('mouseleave', () => { $('img', m).style.transform = ''; });

  $('#similar').innerHTML = rail(`More ${c.title.toLowerCase()} you’ll like`, PRODUCTS.filter(x => x.cat === p.cat && x.id !== p.id).slice(0, 10), '#/' + p.cat);
  $('#recent').innerHTML = rail('Complete the room', PRODUCTS.filter(x => x.cat !== p.cat && x.best).slice(0, 10));
}

/* ---------- cart ---------- */
function pageCart() {
  let coupon = store.get('coupon', '');
  const draw = () => {
    const items = getCart().map(x => ({ ...byId(x.id), qty: x.qty })).filter(x => x.id);
    const wish = getWish().map(byId).filter(Boolean);
    const sub = items.reduce((a, b) => a + b.price * b.qty, 0), mrp = items.reduce((a, b) => a + b.mrp * b.qty, 0);
    const disc = coupon === 'NEST5K' && sub >= 40000 ? 5000 : coupon === 'NEST5K' ? Math.round(sub * 0.05) : 0;
    $('#cartList').innerHTML = items.length ? items.map(p => `
      <div class="ci" data-id="${p.id}"><a href="#/product?id=${p.id}" class="ph"><img src="${IMG(p.img, 240, 240)}" alt=""></a>
      <div><div style="font-size:11.5px;color:var(--muted)">${esc(p.sub)}</div><h3><a href="#/product?id=${p.id}">${esc(p.name)}</a></h3>
        <div class="price" style="margin-top:6px"><b>${inr(p.price)}</b><s>${inr(p.mrp)}</s><em>${p.off}% OFF</em></div>
        <button class="rm" data-rmc="${p.id}">Remove</button> &nbsp; <button class="rm" data-mv="${p.id}" style="color:var(--forest-2)">Save for later</button></div>
      <div class="qty"><button data-cq="-1" aria-label="Decrease">−</button><span>${p.qty}</span><button data-cq="1" aria-label="Increase">+</button></div></div>`).join('')
      : `<div class="card empty"><h3>Your cart is empty</h3><p>Good homes start somewhere — maybe with a sofa?</p><a href="#/offers" class="btn btn-dark" style="margin-top:16px">Shop offers</a></div>`;
    $('#cartCount').textContent = items.reduce((a, b) => a + b.qty, 0);
    $('#summary').innerHTML = `<h3>Order summary</h3>
      <div class="row"><span>Total MRP</span><span>${inr(mrp)}</span></div>
      <div class="row"><span>Discount on MRP</span><span style="color:var(--ok)">− ${inr(mrp - sub)}</span></div>
      ${disc ? `<div class="row"><span>Coupon NEST5K</span><span style="color:var(--ok)">− ${inr(disc)}</span></div>` : ''}
      <div class="row"><span>Delivery &amp; assembly</span><span>${sub >= 4999 || !sub ? 'Free' : inr(299)}</span></div>
      <div class="row tot"><span>Total</span><span>${inr(Math.max(0, sub - disc + (sub && sub < 4999 ? 299 : 0)))}</span></div>
      <form class="coupon" id="cpn"><input placeholder="Coupon code" value="${coupon}" aria-label="Coupon code"><button class="btn btn-line" style="padding:9px 16px">Apply</button></form>
      <div id="cpnMsg" style="font-size:12px;min-height:16px;margin-bottom:10px;color:var(--ok)">${coupon ? (disc ? 'NEST5K applied' : '') : 'Try NEST5K'}</div>
      <button class="btn btn-dark" style="width:100%;padding:15px" ${items.length ? '' : 'disabled'} id="checkout">Checkout securely</button>`;
    $('#saved').innerHTML = wish.length ? rail(`Saved for later (${wish.length})`, wish) : '';
    $('#suggest').innerHTML = rail('Pairs well with your picks', PRODUCTS.filter(p => p.best && !items.find(i => i.id === p.id)).slice(0, 10));
    refreshCounts(); hydrate(document);
  };
  VIEW.addEventListener('click', e => {
    const rm = e.target.closest('[data-rmc]'), mv = e.target.closest('[data-mv]'), q = e.target.closest('[data-cq]');
    if (rm || mv) { const id = (rm || mv).dataset[rm ? 'rmc' : 'mv']; const row = e.target.closest('.ci'); row.classList.add('out');
      setTimeout(() => { store.set('cart', getCart().filter(x => x.id !== id)); if (mv && !getWish().includes(id)) toggleWish(id); draw(); }, 300); }
    if (q) { const id = q.closest('.ci').dataset.id; const c = getCart(); const it = c.find(x => x.id === id); it.qty = Math.max(1, Math.min(9, it.qty + +q.dataset.cq)); store.set('cart', c); draw(); }
    if (e.target.closest('#checkout')) toast('This is a demo storefront — checkout is not connected.');
  });
  VIEW.addEventListener('submit', e => {
    if (e.target.id !== 'cpn') return; e.preventDefault();
    const v = $('#cpn input').value.trim().toUpperCase();
    if (v === 'NEST5K') { coupon = v; store.set('coupon', v); draw(); } else { $('#cpnMsg').style.color = '#B3261E'; $('#cpnMsg').textContent = 'That code isn’t valid'; }
  });
  draw();
}

/* ---------- service forms (interiors / business / care) ---------- */
function initForms() {
  $$('form[data-lead]').forEach(f => {
    f.noValidate = true;
    f.addEventListener('submit', e => {
      e.preventDefault(); let ok = true;
      $$('[required]', f).forEach(i => {
        const fld = i.closest('.field'); const bad = !i.value.trim() || (i.type === 'tel' && !/^[6-9]\d{9}$/.test(i.value.replace(/\D/g, ''))) || (i.type === 'email' && !/^\S+@\S+\.\S+$/.test(i.value));
        fld && fld.classList.toggle('bad', bad); if (bad) ok = false;
      });
      if (ok) { f.closest('.form-wrap').classList.add('sent'); }
      else { const first = $('.bad input, .bad select', f); first && first.focus(); }
    });
  });
  $$('[data-svc]').forEach(a => a.addEventListener('click', () => { const s = $('#c-s'); if (s) { const t = document.createElement('div'); t.innerHTML = a.dataset.svc; s.value = t.textContent; } }));
  $$('[data-again]').forEach(b => b.onclick = () => { const w = b.closest('.form-wrap'); w.classList.remove('sent'); $('form', w).reset(); });
  // estimator (interiors)
  const est = $('#est');
  if (est) {
    const st = { home: 2, pkg: 1, kitchen: true };
    const base = [0, 4.2, 6.1, 8.4, 11.5], mult = [0.82, 1, 1.38];
    const calc = () => { const v = base[st.home] * mult[st.pkg] + (st.kitchen ? 2.6 * mult[st.pkg] : 0); $('#estOut').textContent = `₹${v.toFixed(1)}L – ₹${(v * 1.22).toFixed(1)}L`; };
    $$('[data-home]').forEach(b => b.onclick = () => { st.home = +b.dataset.home; $$('[data-home]').forEach(x => x.classList.toggle('on', x === b)); calc(); });
    $$('[data-pkg]').forEach(b => b.onclick = () => { st.pkg = +b.dataset.pkg; $$('[data-pkg]').forEach(x => x.classList.toggle('on', x === b)); calc(); });
    $('#estKitchen').onchange = e => { st.kitchen = e.target.checked; calc(); };
    calc();
  }
  // simple product rails on service pages
  $$('[data-rail]').forEach(sec => { if (sec.innerHTML.trim()) return; const k = sec.dataset.rail; sec.innerHTML = rail(sec.dataset.title, PRODUCTS.filter(p => p.cat === k).slice(0, 10), '#/' + k); });
}

/* ---------- router (single-file build) ---------- */
const PAGES = {"index": {"page": "home", "cat": "", "title": "Woodnest \u2014 Furniture for Every Corner"}, "just-in": {"page": "category", "cat": "just-in", "title": "Just In \u2014 Woodnest"}, "offers": {"page": "category", "cat": "offers", "title": "Offers \u2014 Woodnest"}, "sofas": {"page": "category", "cat": "sofas", "title": "Sofas \u2014 Woodnest"}, "living": {"page": "category", "cat": "living", "title": "Living \u2014 Woodnest"}, "bedroom": {"page": "category", "cat": "bedroom", "title": "Bedroom \u2014 Woodnest"}, "dining": {"page": "category", "cat": "dining", "title": "Dining \u2014 Woodnest"}, "mattresses": {"page": "category", "cat": "mattresses", "title": "Mattresses \u2014 Woodnest"}, "work-from-home": {"page": "category", "cat": "work-from-home", "title": "Work from Home \u2014 Woodnest"}, "storage": {"page": "category", "cat": "storage", "title": "Storage \u2014 Woodnest"}, "lamps-decor": {"page": "category", "cat": "lamps-decor", "title": "Lamps & Decor \u2014 Woodnest"}, "soft-furnishing": {"page": "category", "cat": "soft-furnishing", "title": "Soft Furnishing \u2014 Woodnest"}, "outdoor": {"page": "category", "cat": "outdoor", "title": "Outdoor \u2014 Woodnest"}, "product": {"page": "product", "cat": "", "title": "Product \u2014 Woodnest"}, "cart": {"page": "cart", "cat": "", "title": "Your Cart \u2014 Woodnest"}, "interiors": {"page": "service", "cat": "", "title": "Interiors \u2014 Woodnest"}, "business": {"page": "service", "cat": "", "title": "For Business \u2014 Woodnest"}, "care-repair": {"page": "service", "cat": "", "title": "Care & Repair \u2014 Woodnest"}};
let VIEW = document.getElementById('view');
function Q() { const h = location.hash.slice(2); const i = h.indexOf('?'); return new URLSearchParams(i < 0 ? '' : h.slice(i + 1)); }
function routeName() { const n = location.hash.replace(/^#\/?/, '').split('?')[0] || 'index'; return PAGES[n] ? n : 'index'; }
function updateNav(n, cat) {
  $$('.hd-links a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#/' + n));
  $$('.subnav a').forEach(a => a.classList.toggle('on', !!cat && a.getAttribute('href') === '#/' + cat));
}
function route() {
  clearInterval(window.__ht);
  const n = routeName(), pg = PAGES[n];
  document.body.dataset.page = pg.page; document.body.dataset.cat = pg.cat;
  document.body.classList.remove('menu-open', 'filters-open');
  const v = document.createElement('div'); v.id = 'view';
  v.innerHTML = document.getElementById('tpl-' + n).innerHTML;
  VIEW.replaceWith(v); VIEW = v;
  document.title = pg.title;
  updateNav(n, pg.cat);
  ({ home: pageHome, category: pageCategory, product: pageProduct, cart: pageCart }[pg.page] || (() => {}))();
  initForms(); hydrate(v);
  const s = Q().get('s');
  const t = s && document.getElementById(s);
  if (t) setTimeout(() => t.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60); else scrollTo(0, 0);
}
// in-page anchors (#consult, #book ...) scroll instead of changing the route
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  const h = a.getAttribute('href'); if (h === '#' || h.startsWith('#/')) return;
  const t = document.getElementById(h.slice(1)); if (t) { e.preventDefault(); t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
});
addEventListener('hashchange', route);
renderLayout();
initGlobal();
route();
window.Woodnest = { PRODUCTS, CAT, IMG };
})();

</script>
</body>
</html>
